name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing package release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rjn32s/gemmadecision'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require the matching package release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "gemmadecision"
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?", tag), tag
          assert tag == "v" + project["version"], (tag, project["version"])
          # Inspect the source without importing package dependencies. A release
          # must not publish a default runtime with unfinished artifact pins.
          import runpy
          constants = runpy.run_path("python/gemmadecision/constants.py")
          assert re.fullmatch(r"[0-9a-f]{40}", constants.get("ONNX_REVISION") or ""), "Pin an immutable ONNX commit before release"
          assert re.fullmatch(r"[0-9a-f]{64}", constants.get("ONNX_MANIFEST_SHA256") or ""), "Pin the verified ONNX manifest SHA256 before release"
          PY
      - name: Install CPU Torch and the complete package with tests
        run: |
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,torch]"
      - name: Run tests without model downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.repository == 'rjn32s/gemmadecision'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gemmadecision/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

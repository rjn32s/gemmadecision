name: Tests and package build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install only dependencies needed to check lazy imports
        run: |
          python -m pip install "pydantic>=2.12,<3" "httpx>=0.28,<1"
          python -m pip install --no-deps .
      - name: Client imports without model runtimes
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import gemmadecision
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("vllm") is None
          assert "torch" not in sys.modules
          assert "transformers" not in sys.modules
          assert "vllm" not in sys.modules
          PY
      - name: Verify the default install excludes heavy optional runtimes
        run: |
          python -m pip install .
          python - <<'PY'
          import importlib.util
          import sys
          import gemmadecision
          import onnxruntime
          import tokenizers
          for name in ('torch', 'transformers', 'torchvision', 'pydantic_ai', 'fastapi', 'granian', 'vllm'):
              assert importlib.util.find_spec(name) is None, name
              assert name not in sys.modules, name
          PY
      - name: Install CPU Torch and optional integrations for tests
        run: |
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,torch]"
      - name: Run unit and integration tests without model downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
